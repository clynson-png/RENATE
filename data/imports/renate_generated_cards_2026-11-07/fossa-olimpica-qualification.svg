<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc">
  <title id="title">Fossa Olímpica — qualificação</title><desc id="desc">Card normativo RENATE. Qualificação com 125 pratos em cinco séries, cinco postos ativos e regras de espingarda e tempo, com referências ISSF.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#0c2735"/></linearGradient><linearGradient id="lime"><stop stop-color="#b7f34a"/><stop offset="1" stop-color="#d5ff73"/></linearGradient><style>.s{font-family:Arial,Helvetica,sans-serif}.m{fill:#a7bdc7}.w{fill:#f4f8fa}.c{fill:#36d7e5}.l{fill:#c7fb57}.small{font-size:17px}.lab{font-size:20px;font-weight:700;letter-spacing:1px}.body{font-size:24px}.b{font-weight:700}</style></defs>
  <rect width="1080" height="820" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="1028" height="768" rx="24" fill="none" stroke="#244757" stroke-width="2"/><rect x="52" y="52" width="10" height="94" rx="5" fill="url(#lime)"/>
  <text x="82" y="82" class="s c lab">CBTE · TIRO AO PRATO OLÍMPICO</text><text x="82" y="132" class="s w" font-size="42" font-weight="700">Fossa Olímpica · Qualificação</text><text x="82" y="174" class="s m body">Trap Olímpico · ISSF 2026 · regras 9.6.1.3, 9.8.1, 9.4.2.1</text>
  <rect x="52" y="212" width="476" height="152" rx="18" fill="#102b3a" stroke="#255568"/><text x="78" y="250" class="s l lab">PROGRAMA</text><text x="78" y="300" class="s w" font-size="36" font-weight="700">125 pratos</text><text x="78" y="338" class="s m body">5 séries × 25 · alvo quebrado = 1</text>
  <rect x="552" y="212" width="476" height="152" rx="18" fill="#102b3a" stroke="#255568"/><text x="578" y="250" class="s l lab">POSTOS ATIVOS</text><g fill="#173849" stroke="#36d7e5" stroke-width="2"><circle cx="620" cy="310" r="26"/><circle cx="704" cy="310" r="26"/><circle cx="788" cy="310" r="26"/><circle cx="872" cy="310" r="26"/><circle cx="956" cy="310" r="26"/></g><g class="s w" font-size="22" font-weight="700" text-anchor="middle"><text x="620" y="318">1</text><text x="704" y="318">2</text><text x="788" y="318">3</text><text x="872" y="318">4</text><text x="956" y="318">5</text></g><text x="578" y="352" class="s m small">5 postos ativos · 6º atleta aguarda no posto 6</text>
  <rect x="52" y="386" width="976" height="222" rx="20" fill="#0c202b" stroke="#1e5967" stroke-width="2"/><text x="82" y="430" class="s c lab">ALVOS, ARMA E RITMO</text><text x="82" y="480" class="s w body b">2 disparos por prato na qualificação</text><text x="82" y="516" class="s m body">A sequência dos pratos varia conforme a regra técnica de cada posto.</text><text x="82" y="558" class="s w body">Espingarda de alma lisa · calibre 12 ou menor</text><text x="82" y="591" class="s m small">Cartucho nominal 24,0 g; até 24,5 g no controle · esferas até 2,6 mm</text>
  <rect x="52" y="630" width="976" height="88" rx="18" fill="#102b3a" stroke="#255568"/><text x="78" y="668" class="s l lab">CHAMADA</text><text x="230" y="668" class="s w body">Intervalo de até 12 s entre a saída do atleta anterior e o pedido do prato.</text><text x="78" y="700" class="s m small">Fontes normativas: ISSF Rule Book 2026 · Edition 2025, Third Print 10/2026 · regras 9.6.1.3, 9.8.1 e 9.4.2.1.</text>
  <text x="52" y="766" class="s m small">Evidência normativa RENATE · consulte as passagens locais citadas para procedimento e exceções.</text>
</svg>
