<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">CBTE Trap Nacional 25 — edição 2024</title><desc id="desc">Card visual complementar: uma série de 25 pratos singles, cinco postos, distribuição técnica Trap ISSF por posto e ordem de rotação. A regra CBTE 2024 define a modalidade; a ISSF complementa o procedimento técnico.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06273d"/><stop offset="1" stop-color="#0b1320"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#79e06a"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="724" rx="22" fill="none" stroke="#29c8d8" stroke-width="3"/><text x="58" y="74" fill="#48d8e4" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">CBTE • TRAP NACIONAL • EDIÇÃO 2024</text><text x="58" y="145" fill="url(#lime)" font-family="Arial,sans-serif" font-size="54" font-weight="800">TRAP 25</text><text x="60" y="184" fill="#d6e5ec" font-family="Arial,sans-serif" font-size="23">CBTE 2024 • uma série de 25 pratos singles</text><g font-family="Arial,sans-serif"><rect x="58" y="220" width="400" height="190" rx="20" fill="#102c3b" stroke="#24546a" stroke-width="2"/><text x="88" y="266" fill="#45d6df" font-size="18" font-weight="700">FORMATO CBTE</text><text x="88" y="335" fill="#ffffff" font-size="54" font-weight="800">25 pratos</text><text x="90" y="378" fill="#c8d9e1" font-size="23">1 série • 25 singles</text><rect x="482" y="220" width="660" height="190" rx="20" fill="#102c3b" stroke="#24546a" stroke-width="2"/><text x="512" y="264" fill="#45d6df" font-size="18" font-weight="700">POSTOS E ROTAÇÃO • REGRA TÉCNICA ISSF TRAP</text><g fill="#0a1c29" stroke="#c8ff4d" stroke-width="3"><circle cx="570" cy="328" r="30"/><circle cx="690" cy="328" r="30"/><circle cx="810" cy="328" r="30"/><circle cx="930" cy="328" r="30"/><circle cx="1050" cy="328" r="30"/></g><g fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle"><text x="570" y="336">1</text><text x="690" y="336">2</text><text x="810" y="336">3</text><text x="930" y="336">4</text><text x="1050" y="336">5</text></g><path d="M605 328h47m73 0h47m73 0h47m73 0h47" stroke="#45d6df" stroke-width="4"/><text x="512" y="386" fill="#c8d9e1" font-size="18">5 alvos por posto: 2 esquerda • 2 direita • 1 centro; ordem variável</text><rect x="58" y="438" width="1084" height="145" rx="20" fill="#102c3b" stroke="#24546a" stroke-width="2"/><text x="88" y="480" fill="#45d6df" font-size="18" font-weight="700">RESULTADO E DISPAROS</text><text x="88" y="531" fill="#ffffff" font-size="27" font-weight="700">Pontuação: pratos acertados / 25 pratos</text><text x="88" y="565" fill="#c8d9e1" font-size="19">Regra técnica ISSF Trap: até 2 tiros por prato na qualificação; movimento entre postos com arma aberta e descarregada.</text><text x="58" y="640" fill="#c8d9e1" font-size="16">Fontes vinculadas: CBTE Trap Nacional 25 (2024), itens 1, 2 e 4; ISSF 2026, regras 6.3.6.1 e 9.8.1.1-9.8.1.2.</text><text x="58" y="680" fill="#83a5b4" font-size="15">Imagem ilustrativa. A prova CBTE 2024 define 25 pratos em uma série; detalhes técnicos complementares são identificados como ISSF.</text></g></svg>