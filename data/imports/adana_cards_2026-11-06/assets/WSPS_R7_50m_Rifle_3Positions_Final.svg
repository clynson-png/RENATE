<rect width="1200" height="1600" rx="38" fill="url(#bg)" stroke="#19c8d8" stroke-width="7"/>
<text x="58" y="86" fill="#24d3e3" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="5">WSPS · RIFLE 50 m · 3 POSIÇÕES</text>
<text x="58" y="185" fill="url(#lime)" font-family="Arial,sans-serif" font-size="68" font-weight="800">R7 · FINAL</text>
<text x="62" y="238" fill="#d8e7ee" font-family="Arial,sans-serif" font-size="31" font-weight="700">MASCULINO · CLASSE SH1</text>
<text x="62" y="286" fill="#9dc0cf" font-family="Arial,sans-serif" font-size="25">35 tiros · 8 finalistas · pontuação decimal</text>
