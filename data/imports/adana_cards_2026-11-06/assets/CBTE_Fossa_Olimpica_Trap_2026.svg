<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">CBTE Fossa Olímpica — Trap Olímpico</title><desc id="desc">Resumo visual da Fossa Olímpica CBTE, com contagem de alvos, estrutura das fases e especificações do prato conforme as fontes ligadas à rota.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06273d"/><stop offset="1" stop-color="#0b1320"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#79e06a"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="724" rx="22" fill="none" stroke="#29c8d8" stroke-width="3"/><text x="58" y="74" fill="#48d8e4" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">CBTE • TIRO AO PRATO OLÍMPICO</text><text x="58" y="145" fill="url(#lime)" font-family="Arial,sans-serif" font-size="54" font-weight="800">FOSSA OLÍMPICA</text><text x="60" y="184" fill="#d6e5ec" font-family="Arial,sans-serif" font-size="23">Trap Olímpico • rota específica CBTE</text><g font-family="Arial,sans-serif"><rect x="58" y="225" width="520" height="200" rx="20" fill="#102c3b" stroke="#24546a" stroke-width="2"/><text x="88" y="270" fill="#45d6df" font-size="18" font-weight="700">QUALIFICAÇÃO</text><text x="88" y="338" fill="#ffffff" font-size="56" font-weight="800">125 pratos</text><text x="90" y="384" fill="#c8d9e1" font-size="24">5 séries × 25 alvos</text><rect x="620" y="225" width="522" height="200" rx="20" fill="#102c3b" stroke="#24546a" stroke-width="2"/><text x="650" y="270" fill="#45d6df" font-size="18" font-weight="700">FASE FINAL • ALVOS POR DISPUTA</text><text x="650" y="330" fill="#ffffff" font-size="28" font-weight="700">Bronze: 25</text><text x="650" y="374" fill="#ffffff" font-size="28" font-weight="700">Ouro / Prata: 30</text><text x="650" y="405" fill="#c8d9e1" font-size="17">Formato segundo a edição ISSF vigente</text><rect x="58" y="458" width="1084" height="145" rx="20" fill="#102c3b" stroke="#24546a" stroke-width="2"/><text x="88" y="500" fill="#45d6df" font-size="18" font-weight="700">PRATO DE ARGILA • REGRA TÉCNICA ISSF 6.3.6.1</text><text x="88" y="548" fill="#ffffff" font-size="25" font-weight="700">Diâmetro 110 ± 1 mm</text><text x="440" y="548" fill="#ffffff" font-size="25" font-weight="700">Altura 25–26 mm</text><text x="790" y="548" fill="#ffffff" font-size="25" font-weight="700">Peso 105 ± 5 g</text><text x="88" y="583" fill="#c8d9e1" font-size="18">Resultado: alvos HIT / total de alvos da fase • cada alvo HIT conta como um acerto</text><text x="58" y="656" fill="#c8d9e1" font-size="16">Fontes: CBTE Regulamento Geral de Tiro ao Prato 2025/2028 (rev. 19/12/2024); ISSF Rule Book 2026, Third Print 10/2026, regras 6.3.6.1, 9.6.1.3 e 9.8.</text><text x="58" y="694" fill="#83a5b4" font-size="15">Não inclui Skeet nem Fossa Automática. Consulte a passagem citada para regra específica, penalidade, desempate ou procedimento.</text></g></svg>