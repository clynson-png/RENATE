<text x="888" y="254" fill="#36d8e6" font-family="Arial,sans-serif" font-size="20" font-weight="700">PRATOS POR POSTO</text>
<g fill="#e5f2f4" font-family="Arial,sans-serif" font-size="17">
<text x="888" y="298">1–3: 3 em cada • alta + dupla alta/baixa</text>
<text x="888" y="350">4: 6 • simples alta e baixa +</text><text x="910" y="376">duplas alta/baixa e baixa/alta</text>
<text x="888" y="426">5–6: 3 em cada • baixa + dupla</text><text x="910" y="452">baixa/alta</text>
<text x="888" y="502">7: 2 • dupla baixa/alta</text>
<text x="888" y="552">8: 2 • simples alta e simples baixa</text></g>
<rect x="882" y="588" width="326" height="88" rx="16" fill="#123c42" stroke="#c8ff45" stroke-width="2"/><text x="908" y="626" fill="#c8ff45" font-family="Arial,sans-serif" font-size="28" font-weight="800">25 por rodada</text><text x="908" y="655" fill="#dcebed" font-family="Arial,sans-serif" font-size="18">75 pratos no total • 3 × 25</text>
<rect x="48" y="730" width="1184" height="42" rx="14" fill="#103b3f"/><text x="72" y="758" fill="#e4f6f5" font-family="Arial,sans-serif" font-size="18" font-weight="700">Após START: cada atleta completa seu posto; toda a esquadra termina antes do rodízio. No posto 8: alta e depois baixa.</text>
