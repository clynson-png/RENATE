<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc">
  <title id="title">Skeet Olímpico — qualificação</title><desc id="desc">Card normativo RENATE. Skeet olímpico com 125 pratos em cinco séries, oito postos, duas casas de lançamento e sequência de simples e duplos conforme ISSF.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#0c2735"/></linearGradient><linearGradient id="lime"><stop stop-color="#b7f34a"/><stop offset="1" stop-color="#d5ff73"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#36d7e5"/></marker><style>.s{font-family:Arial,Helvetica,sans-serif}.m{fill:#a7bdc7}.w{fill:#f4f8fa}.c{fill:#36d7e5}.l{fill:#c7fb57}.small{font-size:17px}.lab{font-size:20px;font-weight:700;letter-spacing:1px}.body{font-size:23px}.b{font-weight:700}</style></defs>
  <rect width="1080" height="820" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="1028" height="768" rx="24" fill="none" stroke="#244757" stroke-width="2"/><rect x="52" y="52" width="10" height="94" rx="5" fill="url(#lime)"/>
  <text x="82" y="82" class="s c lab">CBTE · TIRO AO PRATO OLÍMPICO</text><text x="82" y="132" class="s w" font-size="42" font-weight="700">Skeet Olímpico · Qualificação</text><text x="82" y="174" class="s m body">Esquema da cancha · casas alta/baixa · regra ISSF 9.9</text>
  <rect x="52" y="208" width="590" height="390" rx="20" fill="#0c202b" stroke="#1e5967" stroke-width="2"/><path d="M136 520 Q330 235 550 520" fill="none" stroke="#315a68" stroke-width="4" stroke-dasharray="10 8"/><path d="M112 497 Q325 245 583 497" fill="none" stroke="#36d7e5" stroke-width="3" marker-end="url(#arrow)"/><path d="M112 430 Q330 560 583 430" fill="none" stroke="#ffbd60" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="#173849" stroke="#36d7e5" stroke-width="2"><rect x="78" y="300" width="76" height="76" rx="12"/><rect x="554" y="300" width="76" height="76" rx="12"/></g><text x="116" y="332" text-anchor="middle" class="s w small">CASA</text><text x="116" y="357" text-anchor="middle" class="s l small">ALTA</text><text x="592" y="332" text-anchor="middle" class="s w small">CASA</text><text x="592" y="357" text-anchor="middle" class="s l small">BAIXA</text>
  <g class="s" text-anchor="middle" font-size="18" font-weight="700"><g fill="#c7fb57"><circle cx="124" cy="500" r="22"/><circle cx="205" cy="397" r="22"/><circle cx="295" cy="326" r="22"/><circle cx="376" cy="309" r="22"/><circle cx="457" cy="326" r="22"/><circle cx="530" cy="397" r="22"/><circle cx="582" cy="500" r="22"/><circle cx="376" cy="526" r="22"/></g><g fill="#10212b"><text x="124" y="506">1</text><text x="205" y="403">2</text><text x="295" y="332">3</text><text x="376" y="315">4</text><text x="457" y="332">5</text><text x="530" y="403">6</text><text x="582" y="506">7</text><text x="376" y="532">8</text></g></g>
  <text x="78" y="572" class="s m small">Esquema da cancha; sequência normativa depende do posto.</text>
  <rect x="666" y="208" width="362" height="390" rx="20" fill="#102b3a" stroke="#255568"/><text x="694" y="252" class="s c lab">PROGRAMA</text><text x="694" y="302" class="s w" font-size="34" font-weight="700">125 pratos</text><text x="694" y="338" class="s m body">5 séries × 25</text><text x="694" y="394" class="s l lab">8 POSTOS</text><text x="694" y="432" class="s w body">Simples e duplos nos postos</text><text x="694" y="465" class="s w body">1 a 7; retorno ao posto 4</text><text x="694" y="498" class="s w body">e encerramento no posto 8.</text><text x="694" y="548" class="s m small">1 disparo por prato · 1 prato = 1 acerto</text>
  <rect x="52" y="626" width="976" height="96" rx="18" fill="#0c202b" stroke="#1e5967"/><text x="78" y="664" class="s w body b">Casas alta (High) e baixa (Low) lançam pratos simples e duplos.</text><text x="78" y="696" class="s m small">Fonte normativa: ISSF Rule Book 2026 · Edition 2025, Third Print 10/2026 · regras 9.6.1.3, 9.9.1 e 9.9.2.2.</text>
  <text x="52" y="766" class="s m small">Evidência normativa RENATE · o desenho da cancha é esquemático; consulte a sequência nas passagens citadas.</text>
