<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc">
  <title id="title">Fossa Olímpica — final</title><desc id="desc">Card normativo RENATE com sequência eliminatória da final olímpica de Fossa e referências ISSF.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#0c2735"/></linearGradient><linearGradient id="lime"><stop stop-color="#b7f34a"/><stop offset="1" stop-color="#d5ff73"/></linearGradient><style>.s{font-family:Arial,Helvetica,sans-serif}.m{fill:#a7bdc7}.w{fill:#f4f8fa}.c{fill:#36d7e5}.l{fill:#c7fb57}.small{font-size:17px}.lab{font-size:20px;font-weight:700;letter-spacing:1px}.body{font-size:24px}.b{font-weight:700}</style></defs>
  <rect width="1080" height="820" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="1028" height="768" rx="24" fill="none" stroke="#244757" stroke-width="2"/><rect x="52" y="52" width="10" height="94" rx="5" fill="url(#lime)"/>
  <text x="82" y="82" class="s c lab">CBTE · TIRO AO PRATO OLÍMPICO</text><text x="82" y="132" class="s w" font-size="42" font-weight="700">Fossa Olímpica · Final</text><text x="82" y="174" class="s m body">Trap Olímpico · classificação independente da qualificação</text>
  <rect x="52" y="212" width="976" height="106" rx="18" fill="#102b3a" stroke="#255568"/><text x="82" y="254" class="s l lab">ACESSO</text><text x="230" y="254" class="s w body b">8 atletas classificados · pontuação da qualificação não é transportada</text><text x="230" y="291" class="s m body">A final começa do zero; cada prato acertado vale um ponto.</text>
  <text x="52" y="372" class="s c lab">ELIMINAÇÕES · PRATOS DISPUTADOS</text><path d="M102 456H970" stroke="#36d7e5" stroke-width="4"/>
  <g class="s" text-anchor="middle"><g fill="#173849" stroke="#36d7e5" stroke-width="3"><circle cx="120" cy="456" r="42"/><circle cx="330" cy="456" r="42"/><circle cx="540" cy="456" r="42"/><circle cx="750" cy="456" r="42"/><circle cx="960" cy="456" r="42"/></g><g class="l" font-size="26" font-weight="700"><text x="120" y="465">10</text><text x="330" y="465">15</text><text x="540" y="465">20</text><text x="750" y="465">25</text><text x="960" y="465">30</text></g><g class="w" font-size="17"><text x="120" y="520">7º / 8º</text><text x="330" y="520">5º / 6º</text><text x="540" y="520">4º lugar</text><text x="750" y="520">disputa do bronze</text><text x="960" y="520">ouro / prata</text></g></g>
  <rect x="52" y="574" width="976" height="111" rx="18" fill="#0c202b" stroke="#1e5967" stroke-width="2"/><text x="82" y="618" class="s w body b">1 disparo por prato na final</text><text x="82" y="654" class="s m body">Segundo tiro irregular: prato perdido. A decisão do ouro ocorre na final.</text>
  <text x="52" y="726" class="s m small">Fontes normativas: ISSF Rule Book 2026 · Edition 2025, Third Print 10/2026 · regras 9.17.2, 9.17.4.1–9.17.4.2 e 9.9.2.2.</text><text x="52" y="766" class="s m small">Evidência normativa RENATE · consulte as passagens locais citadas para desempate e procedimentos de final.</text>
</svg>
