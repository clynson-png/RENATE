<title id="title">WSPS R9 — final, 50 m Rifle Prone Open SH2</title><desc id="desc">Card visual da final R9. A sequência resume uma worksheet operacional de 2026, cujo título diverge da identidade R9 Open SH2; confirmar aplicabilidade. Ilustração não normativa.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d2d"/><stop offset="1" stop-color="#0b1520"/></linearGradient><linearGradient id="lime"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#82df4d"/></linearGradient><style>text{font-family:Arial,sans-serif}.label{fill:#42d7e5;font-size:16px;font-weight:700;letter-spacing:2px}.body{fill:#e8f1f4;font-size:20px}.muted{fill:#a9c2cc;font-size:16px}.value{fill:#c8ff4d;font-size:31px;font-weight:800}.small{fill:#d9e8ed;font-size:14px}.warn{fill:#ffd166;font-size:16px;font-weight:700}</style><clipPath id="photo"><rect x="48" y="202" width="326" height="330" rx="18"/></clipPath></defs>
