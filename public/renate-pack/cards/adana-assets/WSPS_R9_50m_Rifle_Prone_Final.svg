<rect x="40" y="174" width="342" height="394" rx="20" fill="#102b3a" stroke="#315a6e" stroke-width="2"/><image x="48" y="202" width="326" height="330" preserveAspectRatio="xMidYMid slice" href="WSPS_R9_Prone_SH2_Illustration.png"/><text x="60" y="552" class="small">Ilustração esportiva • não normativa</text>
<rect x="408" y="174" width="752" height="118" rx="20" fill="#352d1a" stroke="#b48a30" stroke-width="2"/><text x="434" y="213" class="warn">ATENÇÃO À FONTE OPERACIONAL</text><text x="434" y="246" class="small">A worksheet R9 2026 traz “Mixed” no título; o Rulebook identifica R9 como Open SH2. Confirme a aplicabilidade.</text>
