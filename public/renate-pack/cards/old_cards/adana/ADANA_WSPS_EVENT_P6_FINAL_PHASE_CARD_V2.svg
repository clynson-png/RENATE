<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">WSPS P6 — Final — Card em elaboração</title><desc id="desc">Card de prova P6 com fatos específicos preenchidos e localizadores. Rascunho para aprovação; referência visual não é evidência normativa.</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06131c" stop-opacity=".97"/><stop offset=".72" stop-color="#071822" stop-opacity=".9"/><stop offset="1" stop-color="#071822" stop-opacity=".2"/></linearGradient><linearGradient id="accent"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#82df4d"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.k{fill:#42d7e5;font-size:19px;font-weight:700;letter-spacing:1.3px}.p{fill:url(#accent);font-size:54px;font-weight:800}.e{fill:#f0f6f7;font-size:30px;font-weight:700}.l{fill:#42d7e5;font-size:17px;font-weight:700;letter-spacing:.3px}.v{fill:#f0f6f7;font-size:19px;font-weight:600}.s{fill:#bad0d7;font-size:13px}.t{fill:#91aab3;font-size:14px}</style></defs><image x="0" y="0" width="1400" height="1180" preserveAspectRatio="xMidYMid slice" href="ADANA_WSPS_P6_MIXED_AIR_PISTOL_ILLUSTRATION.png" xlink:href="ADANA_WSPS_P6_MIXED_AIR_PISTOL_ILLUSTRATION.png"/><rect width="1400" height="1180" fill="url(#shade)"/><rect x="22" y="22" width="1356" height="1136" rx="26" fill="none" stroke="#19c9db" stroke-opacity=".8" stroke-width="3"/><rect x="50" y="36" width="585" height="34" rx="17" fill="#6b2c13"/><text x="66" y="59" class="t" fill="#fff2cc">EM ELABORAÇÃO · CAMPOS PREENCHIDOS COM FONTES VINCULADAS</text><text x="72" y="112" class="k">WSPS · wsps.event.p6 · MIXED TEAM 10m AIR PISTOL</text><text x="70" y="180" class="p">FINAL</text><text x="72" y="226" class="e">P6 · Pistola de ar 10 m · equipe mista</text><text x="72" y="266" class="k">MISTO · SH1 · 10 m · PISTOLA DE AR</text><rect x="72" y="286" width="1120" height="3" rx="2" fill="#19c9db"/><text x="72" y="360" class="l">PROVA / FASE</text><text x="425" y="360" class="v">P6 · Mixed Team 10m Air Pistol · final WSPS</text><text x="72" y="402" class="l">GÊNERO / CLASSE</text><text x="425" y="402" class="v">Misto · SH1</text><text x="72" y="444" class="l">CALIBRE / ENERGIA</text><text x="425" y="444" class="v">4,5 mm (.177) · ar comprimido, CO2 ou pneumática</text><text x="72" y="486" class="l">ELEGIBILIDADE / EQUIPE</text><text x="425" y="486" class="v">2 atletas da mesma nação · 1 homem + 1 mulher · SH1</text><text x="72" y="528" class="l">FINALISTAS</text><text x="425" y="528" class="v">4 equipes · 8 atletas</text><text x="72" y="570" class="l">SÉRIES / TEMPO</text><text x="425" y="570" class="v">3 séries de 5 por atleta · 250 s/série; depois 9 tiros únicos · 50 s/tiro</text><text x="72" y="612" class="l">TOTAL / ELIMINAÇÕES</text><text x="425" y="612" class="v">24 tiros/atleta · 48/equipe · após 18: 4º; 21: bronze; 24: ouro/prata</text><text x="72" y="654" class="l">PONTUAÇÃO</text><text x="425" y="654" class="v">Decimal (10,0–10,9) · total acumulado combinado da equipe</text><text x="72" y="696" class="l">MÁXIMO RAG</text><text x="425" y="696" class="v">261,6/atleta; 523,2/equipe (24×10,9; 48×10,9)</text><text x="72" y="738" class="l">DESEMPATE</text><text x="425" y="738" class="v">Tiros adicionais sob comando para cada atleta empatado até resolver</text><text x="72" y="780" class="l">PREPARAÇÃO / APRESENTAÇÃO</text><text x="425" y="780" class="v">5 min de preparação e visada; início após 10 s para pistola</text><text x="72" y="822" class="l">REPORTE / MONTAGEM</text><text x="425" y="822" class="v">Reporte ≥30 min antes · montagem ≥15 min · equipes chamadas ~8 min antes</text><text x="72" y="864" class="l">COMANDOS / PAPÉIS</text><text x="425" y="864" class="v">CRO comanda; locutor apresenta/ranking; 1 técnico/equipe</text><text x="72" y="906" class="v">Timeout: 1 por equipe · até 30 s · controlado pelo Jury Member in Charge</text><text x="72" y="930" class="s">Fontes WSPS: §§1.1.3 p.9, 2.1.1 p.11, 5.1.8.1–.3 p.47</text><text x="72" y="953" class="s">ISSF §§6.18.1.2–.7 pp.285–286; 6.18.2.7 p.287; 6.18.3–.9 pp.288–289; 6.3.3.1/.3 pp.194–195; 8.4.3.5 p.358</text><text x="72" y="1002" class="t">Cálculos RAG: máximos teóricos antes de penalidades/descontos; operandos e regra estão indicados.</text><text x="72" y="1030" class="t">Foto ilustrativa autorizada de P6 · complemento visual, não evidência normativa.</text><text x="72" y="1058" class="t">Em elaboração. A planilha MTP P6 tem texto de rifle; estes valores seguem WSPS/ISSF vigentes e citados.</text></svg>