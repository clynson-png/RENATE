<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">WSPS P5 — medidas da pistola e caixa</title><desc id="desc">Medidas exclusivas da prova P5 10m Air Pistol Standard constantes do Apêndice 6 WSPS.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06131b"/><stop offset="1" stop-color="#0c202a"/></linearGradient><style>text{font-family:Arial,sans-serif}.ey{fill:#47dbea;font-size:17px;font-weight:bold;letter-spacing:3px}.title{fill:#caff48;font-size:42px;font-weight:bold}.sub{fill:#d6e5e9;font-size:19px}.h{fill:#47dbea;font-size:22px;font-weight:bold}.t{fill:#e5eff2;font-size:18px}.s{fill:#aec6ce;font-size:15px}.v{fill:#caff48;font-size:25px;font-weight:bold}.p{fill:#102b37;stroke:#21404a;stroke-width:2}.w{fill:#ffc96a;font-size:16px;font-weight:bold}</style></defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/><rect x="22" y="22" width="1156" height="856" rx="25" fill="none" stroke="#18c6d4" stroke-width="3"/>
<text x="58" y="76" class="ey">WSPS • P5 • APÊNDICE 6 • PP. 30–34</text><text x="58" y="132" class="title">PISTOLA STANDARD 10 m</text><text x="58" y="169" class="sub">Estes limites pertencem à P5; não se transferem às outras provas de pistola.</text>
<rect x="52" y="218" width="520" height="250" rx="20" class="p"/><text x="82" y="263" class="h">PISTOLA E MUNIÇÃO</text><text x="82" y="312" class="v">Calibre: 4,5 mm (.177)</text><text x="82" y="351" class="v">Peso máximo: 1.500 g</text><text x="82" y="390" class="v">Gatilho: mínimo 500 g</text><text x="82" y="431" class="t">Carregador com 5 projéteis; peso medido</text><text x="82" y="458" class="t">com acessórios e carregador vazio.</text>
<rect x="612" y="218" width="536" height="250" rx="20" class="p"/><text x="642" y="263" class="h">CAIXA DE MEDIÇÃO</text><text x="642" y="323" class="v">420 × 200 × 50 mm</text><text x="642" y="366" class="t">Tolerância de fabricação da caixa:</text><text x="642" y="399" class="v">0,0 a +1,0 mm</text><text x="642" y="440" class="s">A pistola pode ser medida com o carregador removido.</text>
<rect x="52" y="500" width="1096" height="250" rx="20" class="p"/><text x="82" y="545" class="h">LIMITES E LACUNAS EXPRESSAS</text><text x="82" y="592" class="t">Comprimento máximo do cano: a tabela oficial apresenta “—” (sem valor especificado para P5).</text><text x="82" y="632" class="t">A tabela também especifica o carregador de cinco projéteis e as regras geométricas do punho/apoio.</text><text x="82" y="672" class="t">O apoio do calcanhar do punho precisa formar ângulo de pelo menos 90° com o punho.</text><text x="82" y="714" class="s">Fonte: WSPS Rulebook Appendices 2026 vFinal, Appendix 6, tabela técnica, PDF p. 34; calibre e carregador, p. 30.</text>
<text x="58" y="806" class="w">Card disponível apenas quando o evento resolvido for wsps.event.p5.</text><text x="58" y="837" class="s">Visual complementar. A regra e a página citadas são a evidência normativa.</text>
</svg>
