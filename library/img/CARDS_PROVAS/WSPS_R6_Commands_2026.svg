<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">WSPS R6 — comandos de qualificação e final</title>
  <desc id="desc">Card complementar com sequências separadas da qualificação R6 de 50 metros prone SH1 e da final R6, baseado no regulamento WSPS e na planilha oficial de comandos 2026.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071a29"/><stop offset="1" stop-color="#0a2635"/></linearGradient>
    <style>
      .title{font:800 42px Arial,sans-serif;fill:#b7ff3c;letter-spacing:1px}.sub{font:600 22px Arial,sans-serif;fill:#d8e7ee}.tag{font:700 17px Arial,sans-serif;fill:#2ee4f2;letter-spacing:2px}
      .head{font:800 25px Arial,sans-serif;fill:#33e4f2}.label{font:700 17px Arial,sans-serif;fill:#b7ff3c}.txt{font:500 19px Arial,sans-serif;fill:#e7f0f4}.small{font:500 15px Arial,sans-serif;fill:#a9c2cc}.cmd{font:800 18px Arial,sans-serif;fill:#071a29}
    </style>
  </defs>
  <rect width="1200" height="1500" rx="42" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="1448" rx="34" fill="none" stroke="#18d7e8" stroke-width="4"/>
  <text x="70" y="95" class="tag">WSPS • R6 • 50 m RIFLE PRONE • OPEN SH1</text>
  <text x="70" y="160" class="title">COMANDOS DA PROVA</text>
  <text x="70" y="202" class="sub">Sequências separadas por fase • cartão visual de consulta</text>
  <rect x="60" y="245" width="1080" height="500" rx="26" fill="#102f40" stroke="#2a596b" stroke-width="3"/>
  <text x="95" y="300" class="head">QUALIFICAÇÃO • 60 tiros • 50 m</text>
  <text x="95" y="345" class="small">WSPS 4.1.3 • ISSF 6.11.1.1–6.11.1.3 e 6.11.9.3</text>
  <rect x="95" y="375" width="455" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="403" class="cmd">PREPARATION AND SIGHTING TIME… START</text>
  <text x="95" y="455" class="txt">15 min de preparação e tiros de ensaio ilimitados.</text>
  <rect x="95" y="480" width="250" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="508" class="cmd">30 SECONDS</text>
  <rect x="95" y="535" width="400" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="563" class="cmd">END OF PREPARATION AND SIGHTING… STOP</text>
  <text x="95" y="615" class="txt">Após a pausa e o reinício dos alvos:</text>
  <rect x="95" y="640" width="250" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="668" class="cmd">MATCH FIRING… START</text>
  <text x="95" y="715" class="small">Tempo de prova: 50 min em alvo eletrônico ou 60 min em transportador/poço.</text>
  <rect x="60" y="775" width="1080" height="580" rx="26" fill="#102f40" stroke="#2a596b" stroke-width="3"/>
  <text x="95" y="830" class="head">FINAL • 8 atletas • até 24 tiros</text>
  <text x="95" y="870" class="small">Planilha WSPS Finals Commands 2026 • worksheet R6 • linhas 15–82</text>
  <rect x="95" y="900" width="285" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="928" class="cmd">ATHLETES TO THE LINE</text>
  <rect x="405" y="900" width="280" height="42" rx="12" fill="#b7ff3c"/><text x="427" y="928" class="cmd">TAKE YOUR POSITIONS</text>
  <rect x="95" y="955" width="570" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="983" class="cmd">FIVE MINUTES PREPARATION AND SIGHTING TIME… START</text>
  <rect x="95" y="1010" width="210" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="1038" class="cmd">30 SECONDS</text>
  <rect x="330" y="1010" width="250" height="42" rx="12" fill="#b7ff3c"/><text x="352" y="1038" class="cmd">STOP… UNLOAD</text>
  <text x="95" y="1090" class="txt">Duas séries de 5 tiros • 150 s por série.</text>
  <rect x="95" y="1115" width="130" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="1143" class="cmd">LOAD</text>
  <rect x="245" y="1115" width="150" height="42" rx="12" fill="#b7ff3c"/><text x="267" y="1143" class="cmd">START</text>
  <rect x="415" y="1115" width="140" height="42" rx="12" fill="#b7ff3c"/><text x="437" y="1143" class="cmd">STOP</text>
  <text x="95" y="1195" class="txt">Depois: tiros individuais • 30 s por tiro • LOAD → START → STOP.</text>
  <text x="95" y="1235" class="txt">Eliminações após 12, 14, 16, 18, 20, 22 e 24 tiros.</text>
  <text x="95" y="1275" class="txt">Empate na eliminação: tiro(s) extra(s) até desempatar.</text>
  <rect x="95" y="1300" width="250" height="42" rx="12" fill="#b7ff3c"/><text x="117" y="1328" class="cmd">STOP… UNLOAD</text>
  <text x="70" y="1400" class="small">Card complementar, não substitui a regra citada. Comandos preservados no idioma original; use as citações para consulta normativa.</text>
  <text x="70" y="1432" class="small">Fontes: WSPS Rulebook 2026, 4.1.3 e 4.1.9.1–4.1.9.6; ISSF Rule Book 2026, 6.11.1 e 6.11.9.3; worksheet R6.</text>
</svg>
