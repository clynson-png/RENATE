<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc"><title id="title">WSPS R11 Qualificação — Mixed Team 10m Air Rifle Prone SH2</title><desc id="desc">Resumo visual complementar com características da prova R11 verificadas em fontes WSPS e ISSF incorporadas. Não é evidência normativa.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071b27"/><stop offset="1" stop-color="#0b2634"/></linearGradient><linearGradient id="lime"><stop stop-color="#c3ff38"/><stop offset="1" stop-color="#71dc64"/></linearGradient><clipPath id="photo"><rect x="60" y="280" width="1080" height="350" rx="24"/></clipPath><style>text{font-family:Arial,sans-serif}.small{fill:#24d3e3;font-size:21px;font-weight:700;letter-spacing:2px}.title{fill:url(#lime);font-size:62px;font-weight:800}.event{fill:#d8e7ee;font-size:28px;font-weight:700}.label{fill:#27d2e0;font-size:18px;font-weight:700;letter-spacing:1px}.value{fill:#edf7fa;font-size:21px}.muted{fill:#9dc0cf;font-size:17px}</style></defs><rect width="1200" height="1430" rx="36" fill="url(#bg)" stroke="#19c8d8" stroke-width="6"/><text x="60" y="72" class="small">WSPS · R11 · MIXED TEAM · 10 m AIR RIFLE · SH2</text><text x="60" y="157" class="title">QUALIFICAÇÃO</text><text x="64" y="210" class="event">Carabina de ar · prova mista · posição prone adaptada SH2</text><image href="WSPS_R9_Prone_SH2_Illustration.png" x="60" y="250" width="1080" height="390" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)"/><rect x="60" y="250" width="1080" height="390" rx="24" fill="none" stroke="#2c5668" stroke-width="3"/><rect x="60" y="680" width="1080" height="72" rx="14" fill="#102e3c" stroke="#285264" stroke-width="2"/><text x="82" y="706" class="label">IDENTIDADE</text><text x="82" y="734" class="value">Equipe mista: 1 atleta homem + 1 mulher da mesma nação · classe SH2</text><rect x="60" y="762" width="1080" height="72" rx="14" fill="#102e3c" stroke="#285264" stroke-width="2"/><text x="82" y="788" class="label">ARMA E DISTÂNCIA</text><text x="82" y="816" class="value">Carabina de ar 10 m · calibre 4,5 mm (.177), pela regra ISSF incorporada</text><rect x="60" y="844" width="1080" height="72" rx="14" fill="#102e3c" stroke="#285264" stroke-width="2"/><text x="82" y="870" class="label">POSIÇÃO / APOIO</text><text x="82" y="898" class="value">Prone adaptado: cadeira e mesa; atleta não fica deitado. Suporte de rifle WSPS aprovado</text><rect x="60" y="926" width="1080" height="72" rx="14" fill="#102e3c" stroke="#285264" stroke-width="2"/><text x="82" y="952" class="label">QUALIFICAÇÃO</text><text x="82" y="980" class="value">30 tiros por atleta · 60 por equipe · 25 min em alvo eletrônico; transportador/poço: N/A</text><rect x="60" y="1008" width="1080" height="72" rx="14" fill="#102e3c" stroke="#285264" stroke-width="2"/><text x="82" y="1034" class="label">PONTUAÇÃO / AVANÇO</text><text x="82" y="1062" class="value">Pontuação decimal combinada da equipe · quatro melhores equipes avançam</text><rect x="60" y="1098" width="1080" height="150" rx="18" fill="#0a202c" stroke="#83d448" stroke-width="2"/><text x="82" y="1130" class="label">BASE NORMATIVA · CONSULTA NO LEITOR</text><text x="82" y="1163" class="muted">WSPS §§2.1.1, 4.1.3, 3.7–3.9, 4.2.2.4, 4.2.2.6 · ISSF §§6.18.2.5–.7, 6.3.3.1, 7.7.5</text><text x="82" y="1198" class="muted">Ilustração complementar. A resposta e as fontes citadas prevalecem.</text><text x="82" y="1226" class="muted">R11 é SH2; não confundir com R10 SH1, posição em pé ou calibre .22 LR.</text></svg>