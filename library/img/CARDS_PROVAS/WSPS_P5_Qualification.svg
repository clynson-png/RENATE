<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">WSPS P5 — qualificação — 10m Air Pistol Standard</title>
<desc id="desc">Card visual complementar da WSPS P5. Usa a mesma ilustração de pistola de ar do card P1. P5 é Open, classe SH1, evento não paralímpico, com 40 disparos em oito séries de cinco; 4,5 mm; carregador de cinco chumbinhos; máximo da qualificação calculado em 400 pontos. Não tem final. Consulte as regras e referências recuperadas pela ADANA para os fatos normativos.</desc>
<defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06131c" stop-opacity=".99"/><stop offset=".54" stop-color="#071822" stop-opacity=".90"/><stop offset=".79" stop-color="#071822" stop-opacity=".35"/><stop offset="1" stop-color="#071822" stop-opacity=".08"/></linearGradient><linearGradient id="accent"><stop stop-color="#c8ff4d"/><stop offset="1" stop-color="#82df4d"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.kicker{fill:#42d7e5;font-size:23px;font-weight:700;letter-spacing:2.4px}.phase{fill:url(#accent);font-size:61px;font-weight:800}.event{fill:#f0f6f7;font-size:35px;font-weight:700}.fact{fill:#f0f6f7;font-size:25px;font-weight:600}.source{fill:#bad0d7;font-size:17px}.tiny{fill:#91aab3;font-size:15px;letter-spacing:.3px}</style></defs>
<image x="0" y="0" width="1400" height="900" preserveAspectRatio="xMidYMid slice" href="ADANA_WSPS_P1_AIR_PISTOL_ILLUSTRATION.png" xlink:href="ADANA_WSPS_P1_AIR_PISTOL_ILLUSTRATION.png"/><rect width="1400" height="900" fill="url(#shade)"/><rect x="24" y="24" width="1352" height="852" rx="26" fill="none" stroke="#19c9db" stroke-opacity=".8" stroke-width="3"/>
<text x="76" y="100" class="kicker">WSPS · P5 · OPEN · SH1</text><text x="76" y="174" class="phase">QUALIFICAÇÃO</text><text x="78" y="231" class="event">10m Air Pistol Standard</text><text x="78" y="291" class="fact">40 disparos · 8 séries de 5 · 10 s por série</text><text x="78" y="338" class="fact">Ensaio: 5 disparos · preparo: 3 minutos</text><text x="78" y="385" class="fact">Pistola 4,5 mm · carregador para 5 chumbinhos</text><text x="78" y="466" class="kicker">MÁXIMO DE QUALIFICAÇÃO · CÁLCULO RAG</text><text x="78" y="526" class="event">40 × 10 pontos (anel cheio) = 400 pontos</text><text x="78" y="565" class="source">Máximo antes de deduções ou penalidades; resultado calculado dos operandos citados.</text><text x="78" y="638" class="phase" style="font-size:43px">NÃO TEM FINAL</text><text x="78" y="699" class="source">WSPS 2026: 2.1.1 p.11; Appendix 6 §§1.1–1.2, 2.4, 2.6–2.7 e §3 pp.30,34.</text><text x="78" y="733" class="source">Escala ISSF Third Print §§6.3.3.1–6.3.3.2 p.194, aplicável pela WSPS §1.1.3 p.9.</text><text x="78" y="809" class="tiny">Imagem ilustrativa gerada por IA, a mesma usada no card P1; não é fotografia oficial. Card visual, não evidência normativa.</text></svg>