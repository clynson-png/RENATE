<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Equipamentos WSPS — mapa de consulta</title><desc id="desc">Índice visual, exclusivo WSPS, para localizar cartões de assentos, mesas, vestuário, suporte SH2 e equipamento P5. Não substitui as regras citadas.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06131b"/><stop offset="1" stop-color="#0c202a"/></linearGradient><style>text{font-family:Arial,sans-serif}.ey{fill:#47dbea;font-size:17px;font-weight:bold;letter-spacing:3px}.title{fill:#caff48;font-size:42px;font-weight:bold}.sub{fill:#d6e5e9;font-size:20px}.h{fill:#47dbea;font-size:23px;font-weight:bold}.t{fill:#e5eff2;font-size:19px}.s{fill:#aec6ce;font-size:16px}.p{fill:#102b37;stroke:#21404a;stroke-width:2}</style></defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/><rect x="22" y="22" width="1156" height="856" rx="25" fill="none" stroke="#18c6d4" stroke-width="3"/>
<text x="58" y="76" class="ey">ROTA COMUM WSPS • EQUIPAMENTOS</text><text x="58" y="137" class="title">MEDIDAS E CONTROLES</text><text x="58" y="174" class="sub">Use o card específico para o evento e o equipamento perguntado.</text>
<rect x="58" y="218" width="520" height="170" rx="20" class="p"/><text x="88" y="266" class="h">ASSENTOS E ENCOSTOS</text><text x="88" y="304" class="t">Banco alto • cadeira • cadeira de rodas</text><text x="88" y="340" class="s">WSPS 3.7 • pp. 30–34</text>
<rect x="622" y="218" width="520" height="170" rx="20" class="p"/><text x="652" y="266" class="h">MESAS E APOIOS</text><text x="652" y="304" class="t">Rifle, pistola e apoio de cotovelo</text><text x="652" y="340" class="s">WSPS 3.8 • pp. 34–36</text>
<rect x="58" y="418" width="520" height="170" rx="20" class="p"/><text x="88" y="466" class="h">VESTUÁRIO E ADAPTAÇÕES</text><text x="88" y="504" class="t">Jaqueta • correias • blocos • gatilhos</text><text x="88" y="540" class="s">WSPS 3.2, 3.5–3.6, 4.2 • pp. 25–29, 41–42</text>
<rect x="622" y="418" width="520" height="170" rx="20" class="p"/><text x="652" y="466" class="h">SUPORTE DE CARABINA SH2</text><text x="652" y="504" class="t">Molas • garfo • teste • cotas do desenho</text><text x="652" y="540" class="s">WSPS 3.9 • Apêndice 5 • pp. 36–38 / 24–29</text>
<rect x="58" y="618" width="1084" height="150" rx="20" class="p"/><text x="88" y="666" class="h">P5 • PISTOLA DE AR STANDARD</text><text x="88" y="704" class="t">Calibre, peso, gatilho e caixa de medição aparecem somente na rota P5.</text><text x="88" y="742" class="s">Apêndice 6 • pp. 30–34 • limites P5 não se transferem a outras provas.</text>
<text x="58" y="824" class="s">Fonte: WSPS Rulebook 2026 v1 e WSPS Rulebook Appendices 2026 vFinal. Cards visuais; as regras citadas são a evidência.</text>
</svg>
