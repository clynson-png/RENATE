<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071a25"/><stop offset="1" stop-color="#09111a"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.k{fill:#54e5ef;font-size:20px;font-weight:700;letter-spacing:3px}.t{fill:#c6ff45;font-size:44px;font-weight:800}.s{fill:#c2d6dc;font-size:22px}.lab{fill:#58e4ed;font-size:19px;font-weight:800;letter-spacing:1px}.v{fill:#f3f7f8;font-size:21px;font-weight:650}.n{fill:#a9bec4;font-size:18px}.r{fill:#d0f772;font-size:18px;font-weight:700}.tile{fill:#102e3b;stroke:#1f4855;stroke-width:2}</style></defs><rect width="1200" height="1100" rx="36" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="1064" rx="30" fill="none" stroke="#00c8d9" stroke-width="3"/><text x="62" y="70" class="k">WSPS • R8 • 50m RIFLE 3 POSITIONS • SH1 • FEMININO</text><text x="62" y="128" class="t">RIFLE 5,6 mm (.22) LONG RIFLE</text><text x="62" y="168" class="s">Norma técnica de rifle ISSF incorporada pela WSPS, salvo exceção específica WSPS</text><rect x="62" y="205" width="1076" height="265" rx="22" class="tile"/><g transform="translate(110 280)" fill="none" stroke="#dbe8e9" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M30 65 L770 65 L825 54 L825 76 L770 69 L505 74 L475 110 L372 113 L332 86 L175 93 L110 130 L68 124 L74 85 L30 85 Z"/><path d="M490 74 L520 74 L522 178 L465 178 L465 119"/><path d="M312 84 L295 139 L350 151 L380 112"/><path d="M70 73 L70 49 L115 49 L115 73"/></g><text x="130" y="430" class="n">Desenho esquemático do rifle 50 m; não representa um modelo comercial específico.</text><rect x="62" y="500" width="520" height="110" rx="18" class="tile"/><text x="84" y="536" class="lab">CALIBRE / CARTUCHO</text><text x="84" y="578" class="v">5,6 mm (.22) • rimfire • Long Rifle</text><rect x="618" y="500" width="520" height="110" rx="18" class="tile"/><text x="640" y="536" class="lab">PESO MÁXIMO</text><text x="640" y="578" class="v">8,0 kg • com todos os acessórios</text><rect x="62" y="632" width="520" height="130" rx="18" class="tile"/><text x="84" y="668" class="lab">GANCHO DA SOLEIRA</text><text x="84" y="706" class="v">Projeção ≤153 mm • contorno ≤178 mm</text><text x="84" y="738" class="n">Projeção superior ≤25 mm</text><rect x="618" y="632" width="520" height="130" rx="18" class="tile"/><text x="640" y="668" class="lab">APOIO PALMAR</text><text x="640" y="706" class="v">Até 200 mm abaixo do eixo do cano</text><text x="640" y="738" class="n">Permitido no rifle 50 m somente em pé</text><rect x="62" y="784" width="1076" height="112" rx="18" class="tile"/><text x="84" y="822" class="lab">CONTRAPESOS E CONFIGURAÇÃO</text><text x="84" y="860" class="v">Peso dianteiro: até 90 mm abaixo do eixo e até 700 mm da traseira; não pode funcionar como bipé.</text><text x="62" y="940" class="r">ISSF 7.4.5–7.4.5.2 • pp. 328–330 | WSPS 1.1.3 • p. 9</text><text x="62" y="974" class="n">Consulte o botão “Deseja ver a regra?” para o texto e o localizador oficiais. Card visual complementar.</text><text x="62" y="1038" class="n">A regra limita a configuração e dimensões indicadas; não transfira medidas de carabina de ar ou rifle 300 m.</text></svg>